name: 'CI Action Test'

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm install
      - name: Build action
        run: npm run build
      - name: Run the action
        uses: ./.
        with:
          name: 'GitHub Actions'
